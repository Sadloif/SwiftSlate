name: Fork build (debug APK)

# Builds an installable debug APK for a chosen branch and refreshes the rolling
# "fork-latest" prerelease, so there is a permanent download link.
#
# Dispatch-only on purpose: this file lives on master, and the feature branches
# must not carry it — they are the branches offered upstream as pull requests,
# and fork-only CI in that diff would land in the upstream repo.
#
# Debug-signed: no signing secrets, and it installs over the previous fork build
# (versionCode comes from the clock, so it never goes backwards).
#
# Use: Actions → "Fork build (debug APK)" → Run workflow → pick the branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: false
        default: feat/settings-ui

permissions:
  contents: write

concurrency:
  group: fork-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          # versionCode must increase between builds or Android refuses to
          # install over the previous one; minutes since the epoch fits in Int.
          VC=$(( $(date +%s) / 60 ))
          ./gradlew assembleDebug --no-daemon \
            -PversionCode="$VC" \
            -PversionName="fork-$(date +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSlate-fork-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-latest
          name: Fork build (latest)
          body: |
            Automated debug build of `${{ env.TARGET_REF }}` at `${{ github.sha }}`.
            Debug-signed — installs over the previous fork build.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
